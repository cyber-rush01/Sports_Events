{% extends "sports/base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card auth-card">
            <div class="row g-0">

                <div class="col-md-5 auth-side">
                    <i class="bi bi-trophy-fill display-4 mb-3" style="color:var(--neon);"></i>
                    <h3>Welcome back.</h3>
                    <p class="text-muted mb-0">
                        Log in to view your registrations, track upcoming events,
                        and manage your profile.
                    </p>
                </div>

                <div class="col-md-7">
                    <div class="auth-form">

                        <h2 class="mb-4">Member Login</h2>

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <div class="input-icon-wrap">
                                    <i class="bi bi-person"></i>
                                    <input type="text"
                                           name="username"
                                           class="form-control"
                                           placeholder="Enter your username"
                                           required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-icon-wrap">
                                    <i class="bi bi-lock"></i>
                                    <input type="password"
                                           name="password"
                                           class="form-control"
                                           placeholder="Enter your password"
                                           required>
                                </div>
                            </div>

                            <button type="submit"
                                    class="btn btn-neon w-100 py-2 mt-2">
                                Login
                            </button>

                        </form>

                        <p class="text-center text-muted mt-4 mb-0">
                            Don't have an account?
                            <a href="{% url 'register' %}" class="fw-bold text-decoration-none">
                                Register here
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>

    </div>

</div>

{% endblock %}
